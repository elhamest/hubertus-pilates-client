schema: spec-driven

context: |
  Static Next.js 15 site (output: export, trailingSlash) deployed from main to two hosts:
  GitHub Pages (hubertuspilates.com) and a ParsPack DirectAdmin host by FTP (hubertuspilates.ir).
  No database. The only server code is public/api/contact.php (PHP, runs on the .ir host only).
  Content lives in src/data/fa/index.js and public/locales/fa/common.js; changes ship by editing those files.
  The site is Persian only, RTL. English files exist but are not wired; do not assume English is live.
  Asset paths must start with "/" (trailingSlash breaks relative paths).
  Secrets (support email, passwords) live only in GitHub secrets, never in the repo.
  Keep solutions simple (KISS, YAGNI). JavaScript only (no TypeScript). Styling with CSS Modules.
  There are no automated tests; verify with `npm run build` and `npm run lint`.
  The project owner prefers simple English words in artifacts.
  Read docs/ARCHITECTURE.md (and docs/DEPLOY.md for hosting) before planning a change.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
