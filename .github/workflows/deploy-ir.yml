# Build the static site and upload it to the ParsPack host (hubertuspilates.ir) by FTP.
# Needs 3 repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# And SUPPORT_EMAIL (secret or variable): the address that gets the contact form messages.
# lftp is used because it reconnects and retries when the host drops the FTP connection.
name: Deploy to hubertuspilates.ir

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-ir"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx next build

      # The contact form PHP script reads the support email from this file.
      # The address stays in GitHub secrets, never in the repo.
      - name: Write contact form config
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || vars.SUPPORT_EMAIL }}
        run: |
          if [ -z "$SUPPORT_EMAIL" ]; then
            echo "::warning::SUPPORT_EMAIL secret is empty, the contact form will not send email."
          else
            printf "<?php return '%s';\n" "$SUPPORT_EMAIL" > out/api/contact-config.php
          fi

      # The live site does not change after upload. Check that the FTP host is
      # the same server the domain points to. Prints only IPs, never the secret name.
      - name: Compare FTP host and site IP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host%%/*}"; host="${host%%:*}"
          ftp_ip=$(getent ahostsv4 "$host" | awk 'NR==1{print $1}')
          site_ip=$(getent ahostsv4 hubertuspilates.ir | awk 'NR==1{print $1}')
          echo "FTP host IP: $ftp_ip"
          echo "Site IP:     $site_ip"
          if [ "$ftp_ip" = "$site_ip" ]; then echo "Same server."; else echo "::warning::FTP host and site are on different servers."; fi

      - name: Upload to host by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 20
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:timeout 30
          # Show where the FTP login starts and what is there, to check the upload folder.
          pwd
          cls -1 --sort=name
          cls -1 --sort=name domains/hubertuspilates.ir/
          mirror --reverse --verbose --parallel=1 out/ domains/hubertuspilates.ir/public_html/
          bye
          LFTP
