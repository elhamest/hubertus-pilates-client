# Build the static site and upload it to the ParsPack host (hubertuspilates.ir) by FTP.
# Needs 3 repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# lftp is used because it reconnects and retries when the host drops the FTP connection.
name: Deploy to hubertuspilates.ir

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-ir"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx next build

      - name: Upload to host by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 20
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:timeout 30
          mirror --reverse --verbose --parallel=1 out/ domains/hubertuspilates.ir/public_html/
          bye
          LFTP
