# Build the static site and upload it to the ParsPack host (hubertuspilates.ir) by FTP.
# Needs 3 repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy to hubertuspilates.ir

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy-ir"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx next build

      - name: Upload to host by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./out/
          server-dir: ./domains/hubertuspilates.ir/public_html/
