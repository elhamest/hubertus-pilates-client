# Build the static site and upload it to the ParsPack host (hubertuspilates.ir) by FTP.
# Needs 3 repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# And SUPPORT_EMAIL (secret or variable): the address that gets the contact form messages,
# and SMTP_PASSWORD: the password of the no-reply@hubertuspilates.ir mailbox the form sends from.
# The FTP account root is /home/hubeir/domains/hubertuspilates.ir/ ("Domain" type), so the site folder is public_html/.
# lftp is used because it reconnects and retries when the host drops the FTP connection.
name: Deploy to hubertuspilates.ir

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# A new push stops the running deploy, so only the newest commit is uploaded.
# (The next run uploads all files again, so a stopped upload is fixed by it.)
concurrency:
  group: "deploy-ir"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npx next build

      # The contact form PHP script reads its settings from this file: the support
      # email, and the password of the no-reply@hubertuspilates.ir mailbox it sends from.
      # They stay in GitHub secrets, never in the repo. Base64 keeps any quote in them safe.
      - name: Write contact form config
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || vars.SUPPORT_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SUPPORT_EMAIL" ]; then
            echo "::warning::SUPPORT_EMAIL secret is empty, the contact form will not send email."
            exit 0
          fi
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "::warning::SMTP_PASSWORD secret is empty, the contact form falls back to PHP mail(), which does not deliver."
          fi
          config=$(node -e 'process.stdout.write(Buffer.from(JSON.stringify({
            to: process.env.SUPPORT_EMAIL,
            smtp_user: "no-reply@hubertuspilates.ir",
            smtp_pass: process.env.SMTP_PASSWORD || "",
          })).toString("base64"))')
          printf "<?php return json_decode(base64_decode('%s'), true);\n" "$config" > out/api/contact-config.php

      - name: Upload to host by FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:max-retries 20
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set net:timeout 30
          # The FTP account starts in /home/hubeir/domains/hubertuspilates.ir/
          mirror --reverse --verbose --parallel=1 out/ public_html/
          bye
          LFTP
